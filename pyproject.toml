[project]
name = "llm-smartmem"
version = "0.1.0"
description = "Smart memory management for LLM conversations - topic-aware compression that just works"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Sharan"}
]
keywords = ["llm", "memory", "context", "compression", "langchain", "langgraph", "chatbot", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
google = ["google-generativeai>=0.3.0"]
openai = ["openai>=1.0.0"]
postgres = ["asyncpg>=0.29.0"]
mongo = ["motor>=3.0.0"]
langchain = ["langchain-core>=0.1.0"]
langgraph = ["langgraph>=0.0.50"]
all = [
    "google-generativeai>=0.3.0",
    "openai>=1.0.0",
    "asyncpg>=0.29.0",
    "motor>=3.0.0",
    "langchain-core>=0.1.0",
    "langgraph>=0.0.50",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/sharanharsoor/llmem"
Repository = "https://github.com/sharanharsoor/llmem"
Issues = "https://github.com/sharanharsoor/llmem/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["llmem"]
omit = [
    "tests/*",
    "examples/*",
    "llmem/integrations/*",
    "llmem/storage/postgres.py",
    "llmem/storage/mongo.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if not LANGCHAIN_AVAILABLE:",
    "if not LANGGRAPH_AVAILABLE:",
    "if not TIKTOKEN_AVAILABLE:",
    "raise ImportError",
]
